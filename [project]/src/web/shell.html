<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priston Tale</title>
<style>
	:root { --bg: #0b0b10; --fg: #d8d4c8; --dim: #807a6c; --panel: #15151c; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
	#wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
	#canvas { background: #000; display: block; outline: none; }	/* web\display.js sizes it exactly, for every scaling mode */
	#status { color: var(--dim); min-height: 1.4em; }
	#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: min(1024px, 100%); }
	#bar button { background: var(--panel); color: var(--fg); border: 1px solid #34323c; border-radius: 4px;
	              padding: 4px 10px; font: inherit; cursor: pointer; }
	#bar button:hover { border-color: #5a5566; }
	#bar #saveInfo { color: var(--dim); margin-left: auto; }
	#log { width: min(1024px, 100%); height: 160px; overflow: auto; background: var(--panel); color: var(--dim);
	       font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; padding: 6px 8px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="wrap">
	<canvas id="canvas" width="1024" height="768" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
	<div id="bar">
		<div id="status">Loading...</div>
		<span id="saveInfo" title="Characters and accounts are kept in this browser"></span>
		<button id="btnExport" title="Download a backup of your characters and accounts">Export saves</button>
		<button id="btnImport" title="Replace the saves in this browser with a backup">Import saves</button>
		<input id="fileImport" type="file" accept=".ptsave" hidden>
	</div>
	<div id="log"></div>
</div>
<script src="config.js"></script>
<script>
	// The debug window. Each line used to rewrite the whole text (up to 200,000 characters): a
	// burst of lines - a crash report, a busy map - stalled the page for seconds. Lines now
	// gather and are written at most 4 times a second; error lines at once (a crash can stop
	// the page right after). window.ptFlushLog: what is still waiting, written now.
	var logEl = document.getElementById('log'), logWaiting = [], logTimer = 0;
	function flushLog() {
		clearTimeout(logTimer);
		logTimer = 0;
		if (!logWaiting.length) return;
		var t = logEl.textContent + logWaiting.join('\n') + '\n';
		logWaiting = [];
		if (t.length > 200000) t = t.slice(-100000);
		logEl.textContent = t;
		logEl.scrollTop = logEl.scrollHeight;
	}
	window.ptFlushLog = flushLog;
	function addLog(text) {
		logWaiting.push(text);
		if (/error|abort|AddressSanitizer|crash/i.test(text)) flushLog();
		else if (!logTimer) logTimer = setTimeout(flushLog, 250);
	}
	var Module = {
		ptServerUrl: (window.PT_CONFIG && PT_CONFIG.serverUrl) || '',	// config.js: shared server.exe
		canvas: document.getElementById('canvas'),
		print: function (t) { console.log(t); addLog(t); },
		printErr: function (t) { console.warn(t); addLog(t); },
		setStatus: function (t) { document.getElementById('status').textContent = t || 'Running'; },
		totalDependencies: 0,
		monitorRunDependencies: function (left) {
			this.totalDependencies = Math.max(this.totalDependencies, left);
			Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
		}
	};
	document.getElementById('canvas').addEventListener('click', function () { this.focus(); });

	// Saves (web\pre.js keeps them in IndexedDB): backup file out and in
	var saveInfo = document.getElementById('saveInfo');
	if (Module.ptServerUrl) {			// shared server: characters live on the server, not in this browser
		document.getElementById('btnExport').hidden = document.getElementById('btnImport').hidden = true;
	}
	Module.ptSaveDone = function () { saveInfo.textContent = 'Saved ' + new Date().toLocaleTimeString(); };
	document.getElementById('btnExport').addEventListener('click', function () {
		if (!Module.ptSaves) return;
		saveInfo.textContent = 'Exporting...';
		(Module.ptFlushSaves ? Module.ptFlushSaves() : Promise.resolve())
			.then(function () { return Module.ptSaves.all(); })
			.then(function (entries) {
				var blob = new Blob([Module.ptSaves.pack(entries)], { type: 'application/octet-stream' });
				var a = document.createElement('a');
				a.href = URL.createObjectURL(blob);
				a.download = 'pristontale-saves-' + new Date().toISOString().slice(0, 10) + '.ptsave';
				document.body.appendChild(a); a.click(); a.remove();
				setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
				saveInfo.textContent = 'Exported ' + entries.length + ' file(s)';
			})
			.catch(function (e) { saveInfo.textContent = 'Export failed: ' + e; });
	});
	var fileImport = document.getElementById('fileImport');
	document.getElementById('btnImport').addEventListener('click', function () { fileImport.click(); });
	fileImport.addEventListener('change', function () {
		var f = fileImport.files[0];
		fileImport.value = '';
		if (!f || !Module.ptSaves) return;
		f.arrayBuffer().then(function (buf) {
			var entries = Module.ptSaves.unpack(new Uint8Array(buf));
			if (!confirm('Replace the saves in this browser with "' + f.name + '" (' + entries.length +
			             ' files)?\nThe game restarts; progress since your last export is lost.')) return;
			if (Module.ptServerWorker) Module.ptServerWorker.terminate();		// nothing writes over the import
			return Module.ptSaves.write(entries, true).then(function () { location.reload(); });
		}).catch(function (e) { saveInfo.textContent = 'Import failed: ' + (e.message || e); });
	});
	window.onerror = function (msg) { Module.setStatus('Error: ' + msg); };
</script>
<script src="progress.js"></script>
<script src="display.js"></script>
<script src="fulldl.js"></script>
<script src="settings.js"></script>
<script src="admin.js"></script>
<script>

	// Game files are kept in the browser by the service worker (sw.js): game.js is
	// started once it handles this page, so even the first visit's downloads are
	// stored. (A <template>'s script does not run; emcc needs the placeholder.)
	(function () {
		var started = false;
		// game.js is downloaded once and run from memory (a blob: URL). The game starts 8 threads
		// (workers) from the same script; each used to download game.js again, and in Firefox one of
		// those downloads now and then failed - the game then waited for that thread for ever at
		// "Getting the game ready". From memory, there is nothing left to fail.
		function load() {
			var url = document.getElementById('gameScript').content.querySelector('script').getAttribute('src') +
				(ver ? '?v=' + encodeURIComponent(ver) : '');
			function run(src) {
				var s = document.createElement('script');
				s.src = src;
				document.body.appendChild(s);
			}
			var tries = 0;
			(function get() {
				fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
					.then(function (b) { run(URL.createObjectURL(new Blob([b], { type: 'text/javascript' }))); },
						function () { if (++tries < 3) setTimeout(get, 700 * tries); else run(url); });	// as before, at worst
			})();
		}
		function start() {
			if (started) return;
			started = true;
			window.PT_BUILD = ver;					// progress.js offers a reload when the site's build changes
			if (document.readyState == 'loading') document.addEventListener('DOMContentLoaded', load);	// template below
			else load();
		}
		// The build (version.txt, written at each deploy): game.js and game.wasm are asked for with it,
		// so a plain reload always gets the newest ones - no hard refresh needed.
		var ver = '';
		var gotVer = fetch('version.txt', { cache: 'no-store' })
			.then(function (r) { return r.ok ? r.text() : ''; })
			.then(function (t) { ver = (t || '').trim(); }, function () {});
		// files next to the page (game.js runs from a blob: URL, so its own address can't be the base)
		Module.locateFile = function (path) {
			return new URL(path, location.href).href + (ver && /\.wasm$/.test(path) ? '?v=' + encodeURIComponent(ver) : '');
		};
		// web\fulldl.js: the player picks "play now" or "download the full game" first (once), and
		// with the full game, files changed since the last visit download before the game starts
		function gate() { return window.ptDownloadGate ? window.ptDownloadGate() : null; }
		function go() { gotVer.then(gate, gate).then(start, start); }
		var sw = navigator.serviceWorker;
		if (!sw) return go();					// old browser or private window: downloads as before
		if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
		if (sw.controller) { go(); sw.register('sw.js').catch(function () {}); return; }
		sw.addEventListener('controllerchange', go);
		sw.register('sw.js').then(function () { return sw.ready; }).then(function (reg) {
			if (sw.controller) return go();
			// Shift+Reload (hard refresh) leaves the page unhandled: ask the worker to take it, so the
			// downloads still go through it (download bar, several files at once, stored copies)
			if (reg.active) reg.active.postMessage('claim');
			setTimeout(go, 1500);
		}, go);
		setTimeout(go, 5000);
	})();
</script>
<template id="gameScript">{{{ SCRIPT }}}</template>
</body>
</html>
