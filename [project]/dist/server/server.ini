// server.ini - settings for server.exe when playing solo/offline.
// Copy this next to game.exe and server.exe in the game folder.
// game.exe starts server.exe automatically when this file is present.

*MODE			SERVER
*OFFLINE_MODE
// shared web server: the first login to an ID sets its password
*OFFLINE_PASSWORDS
*SERVER_CODE		0
*SERVER_NAME		WebPT
*MAX_USERS		10

// Monsters and NPCs run by the server
*SERVER_AUTOPLAY

// The server list sent to the game: just this computer
*GAME_SERVER		WebPT		127.0.0.1	127.0.0.1	127.0.0.1

*ENABLE_PARTYITEM
*SERVER_RECORD_MEM

// Optional rates (same keywords the live servers used):
//*EVENT_EXPUP		300
//*ENABLE_SERVER_EXP	50

// Live is a test server too (the user, 2026-11-12): every GM command and cheat at admin level 1
*GM_CHEATS
